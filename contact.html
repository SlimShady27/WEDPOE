    <h2 style="margin-top: 0;"> How to contact Energetic Appliances</h2>
    <p>For more information about our product and services you can contact on the following contacts below:
        <ul>
            <li> Office: 012 245 6780</li>
            <li> Tshepo Taumang: 078 234 2340</li>
        </ul>
    </p>
    
  <form id="contactForm" action="mailto:customerservices@energeticappliances.co.za" method="post" enctype="text/plain" onsubmit="validateContactForm(event)">
  <label for="contactName">Name:</label>
  <input type="text" id="contactName" name="Name" required minlength="2">
<br>
  <label for="contactEmail">Email:</label>
  <input type="email" id="contactEmail" name="Email" required>
<br>
  <label for="phone">Phone Number:</label>
  <input type="tel" id="phone" name="Phone" pattern="[0-9]{10}" placeholder="0123456789" required>
<br>
  <label for="subject">Subject:</label>
  <select id="subject" name="Subject" required>
    <option value="General Inquiry">General Inquiry</option>
    <option value="Technical Support">Technical Support</option>
    <option value="Feedback">Feedback</option>
  </select>
<br>
  <label for="message">Message:</label>
  <textarea id="message" name="Message" rows="5" required minlength="10"></textarea>
<br>
  <button type="submit">Send Email</button>
  <p id="contactError" style="color: rgb(15, 11, 221); display: none;"></p>
</form>

<script>
function validateContactForm(event) {
  const phone = document.getElementById('phone').value;
  const phonePattern = /^[0-9]{10}$/;
  
  if (!phonePattern.test(phone)) {
    event.preventDefault();
    const errorElement = document.getElementById('contactError');
    errorElement.innerText = "Please enter a valid 10-digit phone number.";
    errorElement.style.display = "block";
  }
}
</script>
